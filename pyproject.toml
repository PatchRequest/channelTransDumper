[project]
name = "channeltrans"
version = "0.1.0"
description = "Pulls the transcripts of a YouTube channel into a searchable SQLite database for AI agents."
requires-python = ">=3.12"
dependencies = [
    "yt-dlp[default,curl-cffi]>=2026.10.26",
    "mcp>=2.3,<3",
    "fastembed>=0.9.1",
    "sqlite-vec>=0.1.9",
]

[project.scripts]
channeltrans = "channeltrans.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/channeltrans"]

[tool.pytest.ini_options]
testpaths = ["tests"]
